<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shopping list</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 16px;
    padding-bottom: 96px;
    font-family: system-ui, sans-serif;
    background: light-dark(#f5f5f4, #17181a);
    color: light-dark(#1a1a1a, #e8e8e8);
  }
  h1 { font-size: 1.2rem; margin: 0 0 16px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 4px;
    border-bottom: 1px solid light-dark(#ddd, #333);
  }
  li.checked span { text-decoration: line-through; opacity: 0.5; }
  li span { flex: 1; word-break: break-word; }
  input[type="checkbox"] { width: 22px; height: 22px; flex: none; }
  button.del {
    border: none;
    background: none;
    color: light-dark(#a33, #e88);
    font-size: 1.1rem;
    padding: 4px 8px;
    cursor: pointer;
  }
  .empty { opacity: 0.6; padding: 8px 4px; }
  form {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    gap: 8px;
    padding: 12px;
    background: light-dark(#fff, #222);
    border-top: 1px solid light-dark(#ddd, #333);
  }
  input[type="text"] {
    flex: 1;
    padding: 10px;
    font-size: 1rem;
    border-radius: 6px;
    border: 1px solid light-dark(#ccc, #444);
    background: light-dark(#fff, #2a2a2a);
    color: inherit;
  }
  button.add, button.clear {
    padding: 10px 16px;
    font-size: 1rem;
    border-radius: 6px;
    border: none;
    background: #3a7;
    color: #fff;
    cursor: pointer;
  }
  .toolbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  button.clear { background: light-dark(#ddd, #333); color: inherit; font-size: 0.85rem; padding: 6px 10px; }
</style>
</head>
<body>
  <h1>Shopping list</h1>
  <div class="toolbar"><button class="clear" id="clearBtn">Clear checked</button></div>
  <ul id="list"></ul>
  <form id="addForm">
    <input type="text" id="itemInput" placeholder="Add an item..." autocomplete="off" />
    <button type="submit" class="add">Add</button>
  </form>

<script>
async function load() {
  const res = await fetch("/v1/shopping-list");
  const items = await res.json();
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (items.length === 0) {
    list.innerHTML = '<li class="empty">Nothing on the list.</li>';
    return;
  }
  for (const item of items) {
    const li = document.createElement("li");
    if (item.checked) li.className = "checked";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = item.checked;
    checkbox.addEventListener("change", async () => {
      await fetch(`/v1/shopping-list/${item.id}?checked=${checkbox.checked}`, { method: "PATCH" });
      load();
    });
    const span = document.createElement("span");
    span.textContent = item.text;
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.addEventListener("click", async () => {
      await fetch(`/v1/shopping-list/${item.id}`, { method: "DELETE" });
      load();
    });
    li.append(checkbox, span, del);
    list.appendChild(li);
  }
}

document.getElementById("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("itemInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  await fetch("/v1/shopping-list", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  load();
});

document.getElementById("clearBtn").addEventListener("click", async () => {
  await fetch("/v1/shopping-list/checked", { method: "DELETE" });
  load();
});

load();
</script>
</body>
</html>
