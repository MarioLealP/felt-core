name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      # every check, the same script as locally: ruff, format, ty, file size, layout, TLS,
      # lockfile, pip-audit, pytest (Meru standard)
      - name: checks (scripts/check.sh)
        run: scripts/check.sh
        env:
          # -n auto counts Bahamut's cores, but the runner's Docker service is capped at CPUQuota=400%
          # (clockmost-infra ops/ci-worker/ci-docker.service): more workers than that only fight over 4 CPUs
          PYTEST_XDIST_AUTO_NUM_WORKERS: "4"

      - name: notify on CI failure
        if: failure()
        run: |
          set -uo pipefail
          [ -z "${{ secrets.NTFY_TOKEN }}" ] && exit 0
          curl -fsS -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" -H "Priority: urgent" \
            -H "Title: felt-core CI failed" \
            -d "felt-core CI failed on ${{ github.sha }}: $(printf '%s' "${{ github.event.head_commit.message }}" | head -1)" \
            https://ntfy.clockmost.com/clockmost || true
