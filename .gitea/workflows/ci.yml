name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync

      - name: lint (ruff check)
        run: uv run ruff check

      - name: format (ruff format --check)
        run: uv run ruff format --check

      - name: types (pyright, gated on the WP-39 baseline)
        run: uv run python scripts/check_pyright_baseline.py

      - name: test (pytest)
        run: uv run pytest -v

      - name: notify on CI failure
        if: failure()
        run: |
          set -uo pipefail
          [ -z "${{ secrets.NTFY_TOKEN }}" ] && exit 0
          curl -fsS -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" -H "Priority: urgent" \
            -H "Title: felt-core CI failed" \
            -d "felt-core CI failed on ${{ github.sha }}: $(printf '%s' "${{ github.event.head_commit.message }}" | head -1)" \
            https://ntfy.clockmost.com/clockmost || true

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: Benylin/ci-workflows/.gitea/workflows/deploy.yml@main
    with:
      app: felt-core
    secrets:
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      INFRA_DEPLOY_KEY: ${{ secrets.INFRA_DEPLOY_KEY }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
