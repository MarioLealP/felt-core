name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync

      - name: lint (ruff check)
        run: uv run ruff check

      - name: format (ruff format --check)
        run: uv run ruff format --check

      - name: types (pyright, gated on the WP-39 baseline)
        run: uv run python scripts/check_pyright_baseline.py

      - name: test (pytest)
        run: uv run pytest -v
