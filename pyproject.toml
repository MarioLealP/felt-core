[project]
name = "felt-core"
version = "0.1.0"
description = "Felt's brain: orchestrator, plugin interface, config, model routing"
requires-python = ">=3.12"
dependencies = [
    "dateparser>=1.2.2",
    "fastapi>=0.141.1",
    "fastembed>=0.9.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyipp>=0.17.2",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
]

[project.scripts]
felt-core = "felt_core:main"
felt-core-serve = "felt_core.api:run"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-recording>=0.13.4",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# WP-39 baseline: pre-existing findings not fixed this WP are per-file
# ignored below (see docs/plans/impl/WP-39-tooling.md for the full list
# and why each one is deferred rather than fixed, not a blanket pass).

[tool.ruff.lint.per-file-ignores]
# E501 (line-too-long): pre-existing long comment/string lines, mostly
# 1-22 chars over the 100 limit. Cosmetic-only; deferred to a WP-40+
# chore rather than reflowing ~23 lines across 13 files in a tooling WP.
"plugins/create_calendar_event/skill.py" = ["E501"]
"plugins/felt_presence/skill.py" = ["E501"]
"plugins/generate_image/skill.py" = ["E501"]
"plugins/get_container_status/skill.py" = ["E501"]
"plugins/get_weather/skill.py" = ["E501"]
"plugins/media_control/skill.py" = ["E501"]
"plugins/set_alarm/skill.py" = ["E501"]
"src/felt_core/db.py" = ["E501"]
"src/felt_core/events.py" = ["E501"]
"src/felt_core/music_taste.py" = ["E501"]
# B008 (function-call-in-default-argument): FastAPI's own File()/Form()
# dependency-injection idiom - the "fix" ruff suggests would break the
# framework contract, this is a documented false positive for FastAPI.
"src/felt_core/api.py" = ["E501", "B008"]
# SIM105 (try/except/pass -> contextlib.suppress): behavior-equivalent
# but a semantic rewrite of an asyncio.CancelledError shutdown path;
# deferred rather than risk it in a tooling-only WP.
# WP-40: these three used to be one entry ("src/felt_core/brain.py") before
# the brain/ package split - same pre-existing findings, just spread across
# the files they landed in.
"src/felt_core/brain/orchestrator.py" = ["E501", "SIM105"]
"src/felt_core/brain/background.py" = ["E501"]
"src/felt_core/brain/screen_reactions.py" = ["E501"]
"tests/test_metrics_audit.py" = ["SIM105"]
"tests/test_music_taste_loop.py" = ["SIM105"]
# SIM117 (nested with -> single with): same reasoning as SIM105.
"src/felt_core/ntfy_listener.py" = ["SIM117"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
