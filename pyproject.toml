[project]
name = "felt-core"
version = "0.1.0"
description = "Felt's brain: orchestrator, plugin interface, config, model routing"
# Meru standard is 3.15; 3.14 until onnxruntime (under fastembed, the router) ships cp315 wheels - 1.31.1 has cp314 at
# most (checked 2026-11-10).
requires-python = ">=3.14"
dependencies = [
    "dateparser>=1.2.2",
    "fastapi>=0.141.1",
    "fastembed>=0.9.0",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.15.0",
    "pyipp>=0.17.2",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
]

[project.scripts]
felt-core = "felt_core.__main__:main"
felt-core-serve = "felt_core.api.app:run"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-recording>=0.13.4",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "ty>=0.0.84",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# every core (pytest-xdist); `-n 0` for one process, e.g. with pdb
addopts = "-n auto"
asyncio_mode = "auto"

[tool.ruff]
# Meru's settings (Meru/nuwa-python), adopted 2026-11-10. What failed that day is listed at the
# end of this block as a baseline; each later pass removes entries, and new files get none.
line-length = 120
target-version = "py314"

[tool.ruff.lint]
preview = true
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "Q", "C4", "FAST", "N", "PT", "ERA", "D", "complex-structure", "S"]
ignore = [
    "undocumented-public-init",
    # From S, the rules that guess from a name or an import: on Meru's code they only raised false alarms.
    "assert",
    "hardcoded-bind-all-interfaces",
    "hardcoded-password-string",
    "start-process-with-partial-path",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "unused-async"]
# Home Assistant runs an integration's setup from its __init__.py.
"ha/custom_components/*/__init__.py" = ["non-empty-init-module"]
# Baseline 2026-11-10 (Meru standard pass): what failed when the rules were adopted. Remove a line as its file
# is fixed; never add one for new code.
"plugins/create_calendar_event/skill.py" = ["complex-structure"]
"plugins/media_control/skill.py" = ["complex-structure"]
"plugins/set_reminder/skill.py" = ["complex-structure", "undocumented-public-function", "missing-blank-line-after-summary"]
"plugins/smart_home_control/skill.py" = ["complex-structure"]
"src/felt_core/core/alarms.py" = ["undocumented-public-function", "missing-blank-line-after-summary"]
"src/felt_core/api/app.py" = ["complex-structure"]
"src/felt_core/api/reply.py" = ["complex-structure"]
"src/felt_core/api/self_memory.py" = ["undocumented-public-class", "undocumented-public-function", "missing-blank-line-after-summary"]
"src/felt_core/api/app_stream.py" = ["complex-structure"]
"src/felt_core/brain/__init__.py" = ["missing-blank-line-after-summary", "missing-terminal-punctuation"]
"src/felt_core/brain/music_fast_path.py" = ["missing-blank-line-after-summary"]
"src/felt_core/brain/orchestrator.py" = ["complex-structure"]
"src/felt_core/brain/poe_reactions.py" = ["undocumented-public-function"]
"src/felt_core/brain/result.py" = ["missing-blank-line-after-summary"]
"src/felt_core/core/brief.py" = ["undocumented-public-function", "missing-blank-line-after-summary"]
"src/felt_core/core/calendar_headsup.py" = ["undocumented-public-class", "undocumented-public-function", "missing-blank-line-after-summary"]
"src/felt_core/db/events.py" = ["undocumented-public-function", "missing-blank-line-after-summary"]
"src/felt_core/db/facts.py" = ["undocumented-public-function"]
"src/felt_core/db/proactive.py" = ["undocumented-public-function", "missing-blank-line-after-summary"]
"src/felt_core/core/diary.py" = ["complex-structure"]
"src/felt_core/core/diary_material.py" = ["complex-structure", "undocumented-public-class", "missing-blank-line-after-summary"]
"src/felt_core/dj/control.py" = ["complex-structure", "undocumented-public-function", "missing-blank-line-after-summary", "surrounding-whitespace"]
"src/felt_core/dj/picker.py" = ["missing-blank-line-after-summary"]
"src/felt_core/core/ender.py" = ["complex-structure"]
"src/felt_core/core/events.py" = ["complex-structure"]
"src/felt_core/core/event_prompt.py" = ["complex-structure"]
"src/felt_core/core/features.py" = ["undocumented-public-function", "missing-blank-line-after-summary"]
"src/felt_core/clients/felt_tls.py" = ["undocumented-public-function", "missing-blank-line-after-summary"]
"src/felt_core/clients/ha_assist.py" = ["missing-blank-line-after-summary"]
"src/felt_core/clients/ha_calendar.py" = ["undocumented-public-function", "missing-blank-line-after-summary"]
"src/felt_core/core/ha_tell.py" = ["missing-blank-line-after-summary"]
"src/felt_core/core/her_line.py" = ["undocumented-public-function", "missing-blank-line-after-summary"]
"src/felt_core/api/incident_api.py" = ["undocumented-public-class", "undocumented-public-function", "missing-blank-line-after-summary"]
"src/felt_core/core/incidents.py" = ["undocumented-public-function", "missing-blank-line-after-summary"]
"src/felt_core/core/llm_gate.py" = ["complex-structure", "undocumented-public-function", "missing-blank-line-after-summary", "missing-terminal-punctuation"]
"src/felt_core/clients/local_llm.py" = ["complex-structure"]
"src/felt_core/core/marks.py" = ["undocumented-public-function", "missing-blank-line-after-summary"]
"src/felt_core/clients/meru.py" = ["missing-blank-line-after-summary"]
"src/felt_core/api/notices_api.py" = ["undocumented-public-function", "missing-blank-line-after-summary"]
"src/felt_core/clients/notify.py" = ["missing-blank-line-after-summary"]
"src/felt_core/clients/oauth_token.py" = ["missing-blank-line-after-summary"]
"src/felt_core/core/params.py" = ["undocumented-public-function", "missing-blank-line-after-summary"]
"src/felt_core/models/plugin.py" = ["undocumented-public-class"]
"src/felt_core/core/responder.py" = ["missing-blank-line-after-summary"]
"src/felt_core/clients/shopping.py" = ["undocumented-public-function", "missing-blank-line-after-summary"]
