# Deliberately standalone — not folded into clockmost-infra's compose
# ecosystem, so this file works for anyone deploying felt-core anywhere,
# not just on clockmost's server. The networks below are clockmost-
# specific (edge reaches ninerouter/searxng by DNS; authentik reaches
# octoprint directly, container-to-container, bypassing Caddy/SSO since
# OctoPrint has its own separate API-key auth) — rename/remove for a
# different environment.
services:
  felt-core:
    build: .
    image: felt-core:local
    restart: unless-stopped
    mem_limit: 1g
    env_file: .env
    ports:
      - "8420:8420" # LAN-reachable — a real client (felt-dashboard) needs
        # this now; still no public/internet route, scoped by the host
        # firewall to specific LAN clients (see clockmost-ai-assistant.md)
    volumes:
      - ./plugins:/app/plugins:ro
      - felt-data:/app/data
    networks:
      - edge
      - authentik

networks:
  edge:
    external: true
  authentik:
    external: true

volumes:
  felt-data:
