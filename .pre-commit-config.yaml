repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: check-env-example
        name: .env.example covers every FeltConfig key
        entry: uv run python scripts/check_env_example.py
        language: system
        files: ^(src/felt_core/config\.py|\.env\.example)$
        pass_filenames: false
